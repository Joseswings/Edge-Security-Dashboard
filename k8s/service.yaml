apiVersion: v1
kind: Service
metadata:
  name: edge-security-dashboard
  namespace: edge-cloud
  labels:
    app.kubernetes.io/name: edge-security-dashboard
    app.kubernetes.io/part-of: edge-cybersecurity-cloud
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: edge-security-dashboard
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30081
