apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-security-dashboard
  namespace: edge-cloud
  labels:
    app.kubernetes.io/name: edge-security-dashboard
    app.kubernetes.io/part-of: edge-cybersecurity-cloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-security-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-security-dashboard
        app.kubernetes.io/part-of: edge-cybersecurity-cloud
    spec:
      automountServiceAccountToken: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: edge-security-dashboard:0.2.0-arm64
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: frontend-tmp
              mountPath: /tmp

        - name: backend
          image: edge-security-api:0.2.0-arm64
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: edge-security-dashboard-config
          ports:
            - name: api
              containerPort: 3001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/status
              port: api
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/status
              port: api
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: backend-tmp
              mountPath: /tmp

      volumes:
        - name: nginx-config
          configMap:
            name: edge-security-dashboard-config
            items:
              - key: default.conf
                path: default.conf
        - name: frontend-tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: backend-tmp
          emptyDir:
            sizeLimit: 16Mi
