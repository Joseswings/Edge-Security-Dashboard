apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-security-dashboard-config
  namespace: edge-cloud
  labels:
    app.kubernetes.io/name: edge-security-dashboard
    app.kubernetes.io/part-of: edge-cybersecurity-cloud
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "3001"
  default.conf: |
    server {
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
