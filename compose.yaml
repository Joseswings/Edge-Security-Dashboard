name: edge-security-dashboard

services:
  backend:
    image: ${BACKEND_IMAGE:-edge-security-api:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
    expose:
      - "3001"
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge-dashboard

  frontend:
    image: ${FRONTEND_IMAGE:-edge-security-dashboard:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${EDGE_DASHBOARD_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge-dashboard

networks:
  edge-dashboard:
    driver: bridge
